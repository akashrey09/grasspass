[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasspass"
version = "0.1.0"
description = "Offline-first field cards that get you off the screen and outside, powered by a local open-weight model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
grasspass = "grasspass.cli:main"

[tool.setuptools]
packages = ["grasspass"]
